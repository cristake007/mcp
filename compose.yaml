# Local source build of IBM ContextForge (Python MCP runtime, no Rust).
# Reverse proxy: host Nginx -> 127.0.0.1:4444
name: contextforge

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://contextforge:${POSTGRES_PASSWORD}@postgres:5432/mcp
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
  AUTH_ENCRYPTION_SECRET: ${AUTH_ENCRYPTION_SECRET:?Set AUTH_ENCRYPTION_SECRET}
  PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:?Set PLATFORM_ADMIN_EMAIL}
  PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:?Set PLATFORM_ADMIN_PASSWORD}
  DEFAULT_USER_PASSWORD: ${DEFAULT_USER_PASSWORD:?Set DEFAULT_USER_PASSWORD}
  AUTH_REQUIRED: "true"
  PUBLIC_REGISTRATION_ENABLED: "false"
  APP_DOMAIN: https://mcp.cursurituv.ro
  ENVIRONMENT: production
  CACHE_TYPE: redis
  REDIS_URL: redis://redis:6379/0
  TRANSPORT_TYPE: streamablehttp
  HOST: 0.0.0.0
  RUST_MCP_MODE: off
  MCPGATEWAY_SKIP_MIGRATIONS: "true"
  REQUIRE_USER_IN_DB: "false"

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: contextforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: mcp
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contextforge -d mcp"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks: [backend]

  migration:
    image: contextforge-local:1.0.11
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    command: ["python", "-m", "mcpgateway.bootstrap_db"]
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]

  gateway:
    image: contextforge-local:1.0.11
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:4444:4444"
    environment:
      <<: *app-env
      MCPGATEWAY_SKIP_MIGRATIONS: "true"
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_started
    networks: [backend]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4444/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

networks:
  backend:
    driver: bridge

volumes:
  pgdata:
  redisdata:
