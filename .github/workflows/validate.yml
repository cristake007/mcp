name: Validate FastMCP project

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: mcp
          POSTGRES_PASSWORD: local-ci-secret
          POSTGRES_DB: mcp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mcp -d mcp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_PASSWORD: local-ci-secret
      PUBLIC_BASE_URL: https://mcp.cursurituv.ro
      LOGIN_COOKIE_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      DATABASE_URL: postgresql://mcp:local-ci-secret@localhost:5432/mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt httpx==0.28.1
      - name: Verify Bash management CLI
        run: bash tests/test_mcpctl.sh
      - name: Validate Docker Compose
        run: docker compose config -q
      - name: Validate Nginx security configuration
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx
          sudo install -m 0644 webserver/nginx-limits.conf.example /etc/nginx/conf.d/mcp-security.conf
          sudo install -d -m 0755 /etc/nginx/snippets
          sudo install -m 0644 webserver/nginx-proxy.inc.example /etc/nginx/snippets/mcp-proxy.inc
          sudo install -m 0644 webserver/nginx-hardening.inc.example /etc/nginx/snippets/mcp-hardening.inc
          sudo install -m 0644 webserver/nginx.vhost.example /etc/nginx/sites-available/mcp-example
          sudo ln -s /etc/nginx/sites-available/mcp-example /etc/nginx/sites-enabled/mcp-example
          sudo nginx -t
      - name: Validate operations scripts
        run: bash -n ops/backup.sh ops/offsite-restic.sh ops/install-maintenance.sh ops/prepare-nginx.sh ops/verify-restore.sh
      - name: Compile Python sources
        run: python -m compileall -q app tests
      - name: Import application and check provider
        run: |
          python - <<'PY'
          import inspect
          from app.server import app, provider
          assert not inspect.isabstract(type(provider))
          paths = {route.path for route in app.routes}
          assert "/mcp" in paths
          assert "/login" in paths
          assert "/healthz" in paths
          print("FastMCP imports OK")
          PY
      - name: Validate opt-in RAG Compose overlay
        env:
          RAG_API_TOKEN: ci-bridge-long-secret-0123456789abcdef
        run: docker compose -f compose.yaml -f compose.rag.yaml config -q
      - name: Validate opt-in GSC and combined RAG overlays
        env:
          RAG_API_TOKEN: ci-bridge-long-secret-0123456789abcdef
        run: |
          docker compose -f compose.yaml -f compose.gsc.yaml config -q
          docker compose -f compose.yaml -f compose.rag.yaml -f compose.gsc.yaml config -q
      - name: Verify RAG tools are optional and preserve literal text
        run: |
          MCP_RAG_ENABLED=0 python -m tests.rag_optional
          MCP_RAG_ENABLED=1 MCP_RAG_URL=http://rag-api:8080 MCP_RAG_API_TOKEN=ci-bridge-long-secret-0123456789abcdef python -m tests.rag_optional
      - name: Verify GSC tools are read-only, typed and opt-in
        run: |
          MCP_GSC_ENABLED=0 python -m tests.gsc_optional
          MCP_GSC_ENABLED=1 python -m tests.gsc_optional
          MCP_GSC_ENABLED=1 MCP_RAG_ENABLED=1 python -m tests.rag_optional
      - name: Test read-only SEO page and exact-URL GSC tools
        run: |
          MCP_GSC_ENABLED=0 python -m tests.seo_tools
          MCP_GSC_ENABLED=1 python -m tests.seo_tools
      - name: Validate MCP Apps viewer and private image bridge
        run: python -m tests.rag_viewer_optional
      - name: Test inspect_site (offline, no live site requests)
        run: python -m tests.site_inspector
      - name: Test search_courses (offline, no live site requests)
        run: python -m tests.course_search
      - name: Test adversarial WordPress catalog integrity
        run: python -m tests.catalog_integrity
      - name: Test audited URL identity and explicit acknowledgement
        run: python -m tests.audit_operations
      - name: Test extracted site search service
        run: python -m tests.search_service
      - name: Test isolated site transport, WordPress and refresh contracts
        run: |
          python -m tests.site_clients
          python -m tests.test_site_refresh
      - name: Test focused MCP catalog contracts and shared primitives
        run: |
          python -m tests.catalog_tools
          python -m tests.shared_primitives
          python -m tests.site_tools
          python -m tests.site_client
      - name: Test dedicated tools against legacy interface contracts
        run: python -m tests.focused_interfaces
      - name: Test selective tool registration
        run: |
          MCP_DISABLED_TOOLS=whoami python -m tests.rag_optional
          MCP_DISABLED_TOOLS=search_docs MCP_RAG_ENABLED=1 python -m tests.rag_optional
          MCP_DISABLED_TOOLS=ping,whoami MCP_RAG_ENABLED=1 python -m tests.rag_optional
      - name: Smoke-test OAuth, MCP and token lifecycle
        run: |
          python -m app.manage init-db
          python -m tests.smoke
