name: Validate independent RAG

on:
  push:
    paths:
      - "rag/**"
      - ".github/workflows/validate-rag.yml"
  pull_request:
    paths:
      - "rag/**"
      - ".github/workflows/validate-rag.yml"

jobs:
  rag:
    runs-on: ubuntu-latest
    services:
      database:
        image: pgvector/pgvector:0.8.7-pg18-bookworm
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag-test-secret
          POSTGRES_DB: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: rag
      PGUSER: rag
      PGPASSWORD: rag-test-secret
      RAG_TEST_DB: "1"
      RAG_EMBEDDINGS_ENABLED: "0"
      RAG_DB_PASSWORD: rag-test-secret
      RAG_API_TOKEN: integration-test-long-unpredictable-secret-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated RAG dependencies
        run: python -m pip install -r rag/requirements.txt reportlab==4.4.0 httpx==0.28.1
      - name: Validate standalone Compose configuration
        run: |
          docker compose -f rag/compose.yaml config -q
          docker compose -f rag/compose.yaml -f rag/compose.mcp.yaml config -q
      - name: Compile RAG source
        run: python -m compileall -q rag/ragcore rag/tests
      - name: Verify fidelity and PostgreSQL integration
        run: python -m unittest discover -s rag/tests -v

  docker-smoke:
    runs-on: ubuntu-latest
    env:
      RAG_DB_PASSWORD: ci-only-rag-secret
      RAG_EMBEDDINGS_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Prepare sample documents
        run: |
          mkdir -p rag/documents/subfolder
          printf 'ISO 9001 Articolul 15 păstrare 10 ani\n' > rag/documents/subfolder/procedure.txt
      - name: Build isolated RAG image
        run: docker compose -f rag/compose.yaml build cli
      - name: Start ONLY the RAG database
        run: docker compose -f rag/compose.yaml up -d database
      - name: Run independent RAG lifecycle
        run: |
          docker compose -f rag/compose.yaml run --rm cli init
          docker compose -f rag/compose.yaml run --rm cli scan --lexical-only
          docker compose -f rag/compose.yaml run --rm cli verify
          docker compose -f rag/compose.yaml run --rm cli status
          docker compose -f rag/compose.yaml run --rm cli search --lexical-only 'ISO 9001' | grep -F subfolder/procedure.txt
      - name: Stop RAG stack
        if: always()
        run: docker compose -f rag/compose.yaml down
